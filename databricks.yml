bundle:
  name: retail-analytics
include:
- resources/*.yml
variables:
  catalog:
    description: Unity Catalog name

  schema:
    description: Target schema

  warehouse_id:
    description: SQL Warehouse ID
workspace:
  host: ${var.databricks_host}
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9e376111-e24d.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_ai3_dev
      schema: gold
      warehouse_id: 5b8e2cea7c9d6bbf
  prod:
    mode: production
    run_as:
      user_name: sirskam123@gmail.com
    workspace:
      host: https://dbc-91a4ccf2-831f.cloud.databricks.com
      root_path:  ~/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_ai3
      schema: gold
      warehouse_id: f9cdc9ff1f8d6398
