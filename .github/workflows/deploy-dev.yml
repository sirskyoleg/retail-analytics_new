name: Deploy to Development

on:
  push:
    branches:
      - retail-analytics_new_dev
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests databricks-cli

      # ==========================================================
      # TEST DATABRICKS AUTHENTICATION
      # ==========================================================

      - name: Test Databricks authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
        run: |
          echo "========================================"
          echo "Testing Databricks authentication"
          echo "========================================"

          echo "Host: ${DATABRICKS_HOST}"
          echo "Token exists: ${DATABRICKS_TOKEN:+YES}"
          echo "Token length: ${#DATABRICKS_TOKEN}"

          curl -sS \
            -o response.json \
            -w "HTTP status: %{http_code}\n" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            "${DATABRICKS_HOST}/api/2.0/current-user"

          echo "Response:"
          cat response.json

      # ==========================================================
      # DEPLOY GENIE SPACE
      # ==========================================================

      - name: Deploy Genie Space to Development
        env:
          DATABRICKS_HOST: ${{ secrets.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
          CATALOG_NAME: retail_ai3_dev
        run: |
          echo "========================================"
          echo "Deploying Genie Space to development"
          echo "========================================"

          echo "Host: ${DATABRICKS_HOST}"
          echo "Token exists: ${DATABRICKS_TOKEN:+YES}"
          echo "Token length: ${#DATABRICKS_TOKEN}"
          echo "Catalog: ${CATALOG_NAME}"

          python3 scripts/deploy_genie_space.py

      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "Deployment completed successfully!"
          echo "========================================"

          echo "Workspace: ${{ secrets.DEV_DATABRICKS_HOST }}"
          echo "Catalog: retail_ai3_dev"
