name: PR Comment on Failure

on:
  workflow_run:
    workflows: ["PR Validation"]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      pull-requests: write
    
    steps:
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;
            
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });
            
            if (pulls.data.length > 0) {
              const pr = pulls.data[0];
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## ❌ Deployment Validation Failed

**This PR CANNOT be merged** because validation failed.

**Action Run:** ${run_url}

### Next Steps:
1. Check the error logs in the failed action
2. Fix the issues in your feature branch  
3. Commit and push the fixes
4. Validation will run automatically again

⚠️ **Do not merge until all checks pass!**`
              });
            }
