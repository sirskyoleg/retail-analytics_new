name: Smart Deployment Pipeline

on:
  push:
    branches:
      - retail-analytics_new_dev
      - main
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DATABRICKS_HOST || secrets.DEV_DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.PROD_DATABRICKS_TOKEN || secrets.DEV_DATABRICKS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Deploy with DABs
        run: |
          set -e
          
          TARGET=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          
          echo "🚀 Starting deployment to $TARGET..."
          databricks bundle deploy --target $TARGET
          
          echo "📦 Running create_uc_tables job..."
          databricks bundle run create_uc_tables --target $TARGET
          
          echo "✅ Deployment successful!"
      
      - name: Failure Summary
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED!"
          echo ""
          echo "Environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}"
          echo ""
          echo "The deployment failed - check logs above for details."
          echo "Fix the error in a new commit and push to trigger redeployment."
      
      - name: Success Summary
        if: success()
        run: |
          echo "✅ Successfully deployed to: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}"
          echo "📦 Deployed resources:"
          echo "  - UC Tables"
          echo "  - Delta Live Tables Pipelines"
          echo "  - Jobs"
          echo "  - Notebooks"
